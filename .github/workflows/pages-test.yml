
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages-test.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release
        run: |
          node scripts/check-release.mjs
          node --test r2-worker/test_worker.mjs

      - name: Use production image service
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const file = 'website/config.js';
          const context = {window: {}};
          vm.runInNewContext(fs.readFileSync(file, 'utf8'), context);
          const config = context.window.ATLAS_CONFIG;
          config.mediaBaseUrl = 'https://ancientstarch.cn';
          fs.writeFileSync(file, 'window.ATLAS_CONFIG = ' + JSON.stringify(config, null, 2) + ';\n');
          JS

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./website

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
